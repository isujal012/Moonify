[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web config values are designed to be public (they are shipped to
  # every browser and protected by Firebase security rules / authorized domains),
  # so they are excluded from secrets scanning. The OpenAI key is used only on the
  # server (netlify/server/index.mjs) and is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
